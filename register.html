<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | RuralBiz AI</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->

    <nav class="navbar">

        <div class="logo">
            🌱 RuralBiz <span>AI</span>
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </div>

    </nav>


    <!-- Registration -->

    <section class="auth-section">

        <div class="auth-card">

            <div class="auth-header">

                <div class="auth-icon">
                    🌱
                </div>

                <h1>Create Your Account</h1>

                <p>
                    Start your journey towards a smarter rural business.
                </p>

            </div>


            <form id="registerForm">

                <div class="input-group">

                    <label>Full Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>Mobile Number</label>

                    <input
                        type="tel"
                        id="mobile"
                        placeholder="Enter your mobile number"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>Location</label>

                    <input
                        type="text"
                        id="location"
                        placeholder="Village / District"
                        required
                    >

                </div>


                <button type="submit" class="auth-btn">
                    Create Account →
                </button>

            </form>


            <p class="auth-footer">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </section>


    <!-- Footer -->

    <footer>

        <div class="logo">
            🌱 RuralBiz <span>AI</span>
        </div>

        <p>
            Smart Ideas • Better Decisions • Stronger Rural Businesses
        </p>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
