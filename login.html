<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | RuralBiz AI</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->

    <nav class="navbar">

        <div class="logo">
            🌱 RuralBiz <span>AI</span>
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
        </div>

    </nav>


    <!-- Login Section -->

    <section class="auth-section">

        <div class="auth-card">

            <div class="auth-header">

                <div class="auth-icon">
                    🔐
                </div>

                <h1>Welcome Back</h1>

                <p>
                    Login to continue your RuralBiz AI journey.
                </p>

            </div>


            <form id="loginForm">

                <div class="input-group">

                    <label>Email Address</label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>Password</label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button type="submit" class="auth-btn">
                    Login →
                </button>

            </form>


            <p class="auth-footer">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>

        </div>

    </section>


    <!-- Footer -->

    <footer>

        <div class="logo">
            🌱 RuralBiz <span>AI</span>
        </div>

        <p>
            Smart Ideas • Better Decisions • Stronger Rural Businesses
        </p>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
